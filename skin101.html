<script>

/* =========================================
   QUIZ
========================================= */

const questions =
document.querySelectorAll(".question-card");

const result =
document.querySelector(".quiz-result");

let currentQuestion = 0;
let score = 0;
let quizCompleted = false;


questions.forEach((questionCard) => {

const answers =
questionCard.querySelectorAll(".answer");

const feedback =
questionCard.querySelector(".feedback");

const nextButton =
questionCard.querySelector(".next-button");


answers.forEach(answer => {

answer.addEventListener("click", function(){

if(questionCard.classList.contains("answered")){
return;
}

questionCard.classList.add("answered");

answers.forEach(button=>{
button.classList.add("locked");
});


const isCorrect =
this.dataset.correct === "true";


if(isCorrect){

this.classList.add("correct");

feedback.textContent="CORRECT ✓";

feedback.classList.add(
"show",
"correct-text"
);

score++;

}else{

this.classList.add("incorrect");

feedback.textContent="INCORRECT";

feedback.classList.add(
"show",
"incorrect-text"
);


answers.forEach(button=>{

if(button.dataset.correct==="true"){
button.classList.add("correct");
}

});

}

nextButton.classList.add("show");

});

});


nextButton.addEventListener("click",function(){

questionCard.classList.remove("active");

currentQuestion++;


if(currentQuestion < questions.length){

questions[currentQuestion]
.classList.add("active");

window.scrollTo({

top:
document.querySelector(".quiz").offsetTop - 80,

behavior:"smooth"

});

}else{

document.getElementById("score")
.textContent=score;

result.classList.add("show");


/* COUNT COMPLETED LESSON */

if(!quizCompleted){

completeLesson();

quizCompleted=true;

}


window.scrollTo({

top:
result.offsetTop - 80,

behavior:"smooth"

});

}

});

});


/* =========================================
   COMPLETED LESSON
========================================= */

function completeLesson(){

let peopleReached =
parseInt(
localStorage.getItem("peopleReached")
);

let lessonsDone =
parseInt(
localStorage.getItem("lessonsDone")
);


/* Starting values */

if(isNaN(peopleReached)){
peopleReached=100;
}

if(isNaN(lessonsDone)){
lessonsDone=38;
}


/* ADD ONE */

peopleReached++;
lessonsDone++;


/* SAVE */

localStorage.setItem(
"peopleReached",
peopleReached
);

localStorage.setItem(
"lessonsDone",
lessonsDone
);

}


/* =========================================
   INITIAL VALUES
========================================= */

if(
localStorage.getItem("peopleReached") === null
){

localStorage.setItem(
"peopleReached",
"100"
);

}


if(
localStorage.getItem("lessonsDone") === null
){

localStorage.setItem(
"lessonsDone",
"38"
);

}

</script>
